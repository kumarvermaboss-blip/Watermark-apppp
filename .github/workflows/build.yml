name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer & Android SDK/NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-v2
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev unzip zip ccache autoconf libtool pkg-config libffi-dev libssl-dev
        python -m pip install --upgrade "pip<24.1" "setuptools<69.0.0" wheel
        pip install cython==0.29.33
        pip install buildozer

    - name: Patch p4a pip upgrade bug
      run: |
        python -c "
        import os, site
        for site_p in site.getsitepackages():
            target_file = os.path.join(site_p, 'pythonforandroid', 'build.py')
            if os.path.exists(target_file):
                with open(target_file, 'r') as f:
                    data = f.read()
                data = data.replace('pip install -U pip', 'pip install \"pip<24.1\" \"setuptools<69.0.0\"')
                with open(target_file, 'w') as f:
                    f.write(data)
                print('Successfully patched python-for-android!')
        "

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WatermarkApp-APK
        path: bin/*.apk
