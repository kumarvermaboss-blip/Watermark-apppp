name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Speed enhancement: Cache buildozer & SDK/NDK
    - name: Cache Buildozer & Android SDK/NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-arm64
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev unzip zip ccache autoconf libtool pkg-config libffi-dev libssl-dev
        pip install "pip<24.0" "setuptools<69.0" wheel
        pip install cython==0.29.33
        pip install buildozer

    - name: Patch p4a pip upgrade bug
      run: |
        python -c "
        import os, site
        for p in site.getsitepackages():
            target = os.path.join(p, 'pythonforandroid', 'build.py')
            if os.path.exists(target):
                with open(target, 'r') as f: content = f.read()
                content = content.replace('pip install -U pip', 'pip install \"pip<24.0\"')
                with open(target, 'w') as f: f.write(content)
                print('Patched successfully!')
        "

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WatermarkApp-APK
        path: bin/*.apk
